[workspace]
members = [
    "crates/tree-core",
    "crates/tree-git",
    "crates/tree-storage",
    "apps/tree-server",
    "apps/tree-cli",
    "tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Tree Contributors"]
license = "Apache-2.0"
repository = "https://github.com/tree-vcs/tree"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "set-header", "timeout"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
bytes = "1.7"
futures-util = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
tempfile = "3.12"
async-trait = "0.1"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1.10"
argon2 = "0.5"
rand = { version = "0.8", features = ["std"] }

# Workspace crates
tree-core = { path = "crates/tree-core" }
tree-git = { path = "crates/tree-git" }
tree-storage = { path = "crates/tree-storage" }
tree-server = { path = "apps/tree-server" }

name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit

  codeql:
    name: CodeQL (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          # CodeQL supports Rust via `cargo` autobuild; no manual build step needed
          # beyond `cargo build`. Queries: security-and-quality keeps signal/noise balanced.
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"

  # Dependency freshness is handled by Dependabot (see .github/dependabot.yml).
  # Secret scanning and push protection are GitHub repository settings:
  #   Settings → Code security → Secret scanning / Push protection → Enable.
  # Code scanning results from the `codeql` job above appear under
  #   Security → Code scanning alerts.

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tree — Quiet Git Hosting</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-card-header: #1f242c;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --text-bright: #f0f6fc;
      --accent: #238636;
      --accent-hover: #2ea043;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    code, pre {
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .header {
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-card);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 20px;
    }

    .logo.clickable {
      cursor: pointer;
    }

    .site-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-bright);
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-left: 8px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
    }

    .separator {
      color: var(--text-muted);
    }

    .owner-crumb {
      color: var(--text-muted);
    }

    .repo-crumb {
      color: var(--text-bright);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-bright);
    }

    .btn {
      background-color: #21262d;
      color: var(--text-bright);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background-color: #30363d;
      border-color: #8b949e;
    }

    .btn-primary {
      background-color: var(--accent);
      border-color: rgba(240, 246, 252, 0.1);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
    }

    .repo-list {
      display: grid;
      grid-gap: 12px;
    }

    .repo-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .repo-card:hover {
      border-color: #58a6ff;
    }

    .repo-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .repo-name {
      font-size: 16px;
      color: #58a6ff;
    }

    .repo-desc {
      color: var(--text);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .repo-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
    }

    .badge-public {
      background-color: rgba(56, 139, 253, 0.1);
      color: #58a6ff;
      border-color: rgba(56, 139, 253, 0.4);
    }

    .badge-private {
      background-color: rgba(210, 153, 34, 0.1);
      color: #d29922;
      border-color: rgba(210, 153, 34, 0.4);
    }

    .badge-default {
      background-color: #21262d;
      color: var(--text-muted);
      margin-left: 8px;
    }

    .clone-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .clone-label {
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .clone-input {
      flex: 1;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      color: var(--text-bright);
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 16px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--text-bright);
      border-bottom-color: #f78166;
    }

    .file-tree-card, .branches-card, .commits-card, .readme-card, .blob-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .tree-header, .readme-header, .blob-header {
      background-color: var(--bg-card-header);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .branch-pill {
      background: #0d1117;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .tree-table, .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .tree-table th, .tree-table td, .data-table th, .data-table td {
      padding: 8px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .tree-table tr:last-child td, .data-table tr:last-child td {
      border-bottom: none;
    }

    .tree-row {
      cursor: pointer;
    }

    .tree-row:hover {
      background-color: #1f242c;
    }

    .name-cell {
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .size-cell {
      color: var(--text-muted);
      font-size: 12px;
      width: 100px;
    }

    .action-cell {
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      width: 60px;
      text-align: right;
    }

    .readme-body, .blob-body {
      padding: 18px 24px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }

    .commit-log {
      display: flex;
      flex-direction: column;
    }

    .commit-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .commit-item:last-child {
      border-bottom: none;
    }

    .commit-summary {
      color: var(--text-bright);
      margin-bottom: 4px;
    }

    .commit-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .commit-meta .author {
      font-weight: 500;
      color: var(--text);
    }

    .sha code {
      background: #0d1117;
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 4px;
      color: #58a6ff;
    }

    .empty-repo-instructions {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px;
    }

    .empty-repo-instructions h3 {
      color: var(--text-bright);
      margin-bottom: 8px;
    }

    .empty-repo-instructions pre {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      margin-top: 12px;
      color: #58a6ff;
    }

    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.hidden {
      display: none;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      width: 440px;
    }

    .modal-header {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .input {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text-bright);
      font-size: 13px;
    }

    .input:focus {
      outline: none;
      border-color: #58a6ff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .empty-state {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    class TreeApp {
      constructor() {
        this.currentOwner = null;
        this.currentRepo = null;
        this.activeTab = 'files';
        this.currentPath = '';
        this.currentRevision = 'main';
        this.init();
      }

      init() {
        window.addEventListener('popstate', () => this.handleRoute());
        this.handleRoute();
      }

      navigate(url) {
        window.history.pushState({}, '', url);
        this.handleRoute();
      }

      async handleRoute() {
        const path = window.location.pathname;
        const parts = path.split('/').filter(Boolean);

        if (parts.length >= 2 && parts[0] !== 'ui') {
          this.currentOwner = parts[0];
          this.currentRepo = parts[1].replace('.git', '');
          await this.renderRepositoryPage();
        } else if (parts.length >= 3 && parts[0] === 'ui') {
          this.currentOwner = parts[1];
          this.currentRepo = parts[2].replace('.git', '');
          await this.renderRepositoryPage();
        } else {
          this.currentOwner = null;
          this.currentRepo = null;
          await this.renderDashboard();
        }
      }

      async renderDashboard() {
        const appEl = document.getElementById('app');
        if (!appEl) return;

        appEl.innerHTML = `
          <div class="header">
            <div class="logo-title">
              <span class="logo">🌲</span>
              <span class="site-name">Tree</span>
              <span class="subtitle">Quiet Git Hosting</span>
            </div>
          </div>

          <div class="container">
            <div class="toolbar">
              <div class="section-title">Repositories</div>
              <button class="btn btn-primary" id="btn-create-modal">+ New Repository</button>
            </div>

            <div id="repo-list" class="repo-list">
              <div class="loading">Loading repositories...</div>
            </div>
          </div>

          <div id="modal" class="modal hidden">
            <div class="modal-content">
              <div class="modal-header">Create Repository</div>
              <div class="form-group">
                <label>Owner</label>
                <input type="text" id="new-repo-owner" value="user" class="input" />
              </div>
              <div class="form-group">
                <label>Name</label>
                <input type="text" id="new-repo-name" placeholder="my-project" class="input" />
              </div>
              <div class="form-group">
                <label>Description (optional)</label>
                <input type="text" id="new-repo-desc" placeholder="A quiet project" class="input" />
              </div>
              <div class="modal-actions">
                <button class="btn" id="btn-cancel-modal">Cancel</button>
                <button class="btn btn-primary" id="btn-submit-repo">Create</button>
              </div>
            </div>
          </div>
        `;

        document.getElementById('btn-create-modal')?.addEventListener('click', () => {
          document.getElementById('modal')?.classList.remove('hidden');
        });

        document.getElementById('btn-cancel-modal')?.addEventListener('click', () => {
          document.getElementById('modal')?.classList.add('hidden');
        });

        document.getElementById('btn-submit-repo')?.addEventListener('click', () => this.handleCreateRepo());

        try {
          const res = await fetch('/repositories');
          const repos = await res.json();
          const listEl = document.getElementById('repo-list');
          if (!listEl) return;

          if (repos.length === 0) {
            listEl.innerHTML = `
              <div class="empty-state">
                <div class="empty-icon">📭</div>
                <div class="empty-text">No repositories yet. Create one or push via CLI.</div>
              </div>
            `;
            return;
          }

          listEl.innerHTML = repos
            .map(
              (r) => `
            <div class="repo-card" onclick="window.treeApp.navigate('/${r.owner_name}/${r.name}')">
              <div class="repo-card-header">
                <span class="repo-name">${r.owner_name} / <strong>${r.name}</strong></span>
                <span class="badge ${r.is_private ? 'badge-private' : 'badge-public'}">${
                r.is_private ? 'private' : 'public'
              }</span>
              </div>
              <div class="repo-desc">${r.description || 'No description provided.'}</div>
              <div class="repo-meta">Default branch: <code>${r.default_branch}</code> • Created ${new Date(
                r.created_at
              ).toLocaleDateString()}</div>
            </div>
          `
            )
            .join('');
        } catch (err) {
          console.error(err);
        }
      }

      async handleCreateRepo() {
        const owner = document.getElementById('new-repo-owner')?.value || 'user';
        const name = document.getElementById('new-repo-name')?.value;
        const description = document.getElementById('new-repo-desc')?.value;

        if (!name) {
          alert('Repository name is required');
          return;
        }

        try {
          const res = await fetch('/repositories', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ owner, name, description }),
          });

          if (res.ok) {
            this.navigate(`/${owner}/${name}`);
          } else {
            const err = await res.text();
            alert(`Failed to create repository: ${err}`);
          }
        } catch (e) {
          alert(`Network error: ${e}`);
        }
      }

      async renderRepositoryPage() {
        const appEl = document.getElementById('app');
        if (!appEl || !this.currentOwner || !this.currentRepo) return;

        try {
          const res = await fetch(`/repositories/${this.currentOwner}/${this.currentRepo}`);
          if (!res.ok) {
            appEl.innerHTML = `
              <div class="container">
                <div class="error-box">Repository ${this.currentOwner}/${this.currentRepo} not found.</div>
                <button class="btn" onclick="window.treeApp.navigate('/')">← Return Home</button>
              </div>
            `;
            return;
          }

          const summary = await res.json();
          this.currentRevision = summary.default_branch;

          appEl.innerHTML = `
            <div class="header">
              <div class="breadcrumb">
                <span class="logo clickable" onclick="window.treeApp.navigate('/')">🌲 Tree</span>
                <span class="separator">/</span>
                <span class="owner-crumb">${this.currentOwner}</span>
                <span class="separator">/</span>
                <strong class="repo-crumb">${this.currentRepo}</strong>
                <span class="badge ${summary.repository.is_private ? 'badge-private' : 'badge-public'}">${
            summary.repository.is_private ? 'private' : 'public'
          }</span>
              </div>
            </div>

            <div class="container">
              <div class="clone-box">
                <div class="clone-label">Clone</div>
                <input type="text" readonly value="${summary.clone_url_http}" class="clone-input" onclick="this.select()" />
                <button class="btn btn-sm" onclick="navigator.clipboard.writeText('${summary.clone_url_http}')">Copy</button>
              </div>

              <div class="tabs">
                <button class="tab-btn ${this.activeTab === 'files' ? 'active' : ''}" id="tab-files">Files</button>
                <button class="tab-btn ${this.activeTab === 'branches' ? 'active' : ''}" id="tab-branches">Branches (${summary.branches_count})</button>
                <button class="tab-btn ${this.activeTab === 'commits' ? 'active' : ''}" id="tab-commits">Commits (${summary.commits_count})</button>
              </div>

              <div id="tab-content" class="tab-content">
                <!-- Rendered Tab -->
              </div>
            </div>
          `;

          document.getElementById('tab-files')?.addEventListener('click', () => {
            this.activeTab = 'files';
            this.updateTabs();
            this.renderFilesTab(summary);
          });

          document.getElementById('tab-branches')?.addEventListener('click', () => {
            this.activeTab = 'branches';
            this.updateTabs();
            this.renderBranchesTab();
          });

          document.getElementById('tab-commits')?.addEventListener('click', () => {
            this.activeTab = 'commits';
            this.updateTabs();
            this.renderCommitsTab();
          });

          if (this.activeTab === 'files') {
            await this.renderFilesTab(summary);
          } else if (this.activeTab === 'branches') {
            await this.renderBranchesTab();
          } else {
            await this.renderCommitsTab();
          }
        } catch (e) {
          console.error(e);
        }
      }

      updateTabs() {
        ['files', 'branches', 'commits'].forEach((tab) => {
          const btn = document.getElementById(`tab-${tab}`);
          if (btn) {
            if (tab === this.activeTab) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          }
        });
      }

      async renderFilesTab(summary) {
        const container = document.getElementById('tab-content');
        if (!container) return;

        if (summary.is_empty) {
          container.innerHTML = `
            <div class="empty-repo-instructions">
              <h3>Quick Setup</h3>
              <p>Get started by pushing from your local terminal:</p>
              <pre><code>git clone ${summary.clone_url_http}
cd ${summary.repository.name}
echo "# ${summary.repository.name}" > README.md
git add README.md
git commit -m "initial commit"
git push -u origin main</code></pre>
            </div>
          `;
          return;
        }

        try {
          const url = `/repositories/${this.currentOwner}/${this.currentRepo}/tree?ref=${this.currentRevision}&path=${encodeURIComponent(
            this.currentPath
          )}`;
          const res = await fetch(url);
          const entries = await res.json();

          let html = `
            <div class="file-tree-card">
              <div class="tree-header">
                <span class="branch-pill">branch: <strong>${this.currentRevision}</strong></span>
                <span class="path-pill">${this.currentPath || '/'}</span>
              </div>
              <table class="tree-table">
                <tbody>
          `;

          if (this.currentPath) {
            const parentPath = this.currentPath.split('/').slice(0, -1).join('/');
            html += `
              <tr class="tree-row back-row" onclick="window.treeApp.browsePath('${parentPath}')">
                <td colspan="3"><span class="icon">📁</span> ..</td>
              </tr>
            `;
          }

          for (const entry of entries) {
            if (entry.is_dir) {
              html += `
                <tr class="tree-row" onclick="window.treeApp.browsePath('${entry.path}')">
                  <td class="name-cell"><span class="icon">📁</span> <strong>${entry.name}</strong></td>
                  <td class="size-cell">-</td>
                  <td class="action-cell">dir</td>
                </tr>
              `;
            } else {
              html += `
                <tr class="tree-row" onclick="window.treeApp.viewBlob('${entry.path}')">
                  <td class="name-cell"><span class="icon">📄</span> ${entry.name}</td>
                  <td class="size-cell">${formatBytes(entry.size)}</td>
                  <td class="action-cell">blob</td>
                </tr>
              `;
            }
          }

          html += `
                </tbody>
              </table>
            </div>
          `;

          if (summary.readme_content && !this.currentPath) {
            html += `
              <div class="readme-card">
                <div class="readme-header">📖 README</div>
                <pre class="readme-body"><code>${escapeHtml(summary.readme_content)}</code></pre>
              </div>
            `;
          }

          container.innerHTML = html;
        } catch (e) {
          container.innerHTML = `<div class="error-box">Failed to load files: ${e}</div>`;
        }
      }

      async browsePath(path) {
        this.currentPath = path;
        const res = await fetch(`/repositories/${this.currentOwner}/${this.currentRepo}`);
        const summary = await res.json();
        await this.renderFilesTab(summary);
      }

      async viewBlob(path) {
        const container = document.getElementById('tab-content');
        if (!container) return;

        try {
          const url = `/repositories/${this.currentOwner}/${this.currentRepo}/blob?ref=${this.currentRevision}&path=${encodeURIComponent(
            path
          )}`;
          const res = await fetch(url);
          const blob = await res.json();

          container.innerHTML = `
            <div class="blob-card">
              <div class="blob-header">
                <button class="btn btn-sm" onclick="window.treeApp.browsePath('${this.currentPath}')">← Back to tree</button>
                <span class="blob-path">${blob.path} (${formatBytes(blob.size)})</span>
              </div>
              <div class="blob-body">
                ${
                  blob.is_binary
                    ? '<div class="binary-warning">Binary file cannot be displayed inline.</div>'
                    : `<pre><code>${escapeHtml(blob.content || '')}</code></pre>`
                }
              </div>
            </div>
          `;
        } catch (e) {
          container.innerHTML = `<div class="error-box">Failed to load file: ${e}</div>`;
        }
      }

      async renderBranchesTab() {
        const container = document.getElementById('tab-content');
        if (!container) return;

        try {
          const res = await fetch(`/repositories/${this.currentOwner}/${this.currentRepo}/branches`);
          const branches = await res.json();

          if (branches.length === 0) {
            container.innerHTML = `<div class="empty-state">No branches found.</div>`;
            return;
          }

          container.innerHTML = `
            <div class="branches-card">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Branch</th>
                    <th>Commit</th>
                    <th>Last Author</th>
                    <th>Message</th>
                  </tr>
                </thead>
                <tbody>
                  ${branches
                    .map(
                      (b) => `
                    <tr>
                      <td>
                        <strong>${b.name}</strong>
                        ${b.is_default ? '<span class="badge badge-default">default</span>' : ''}
                      </td>
                      <td><code>${b.commit_id.slice(0, 7)}</code></td>
                      <td>${b.commit_author || '-'}</td>
                      <td class="msg-cell">${b.commit_message || '-'}</td>
                    </tr>
                  `
                    )
                    .join('')}
                </tbody>
              </table>
            </div>
          `;
        } catch (e) {
          container.innerHTML = `<div class="error-box">Failed to load branches: ${e}</div>`;
        }
      }

      async renderCommitsTab() {
        const container = document.getElementById('tab-content');
        if (!container) return;

        try {
          const res = await fetch(
            `/repositories/${this.currentOwner}/${this.currentRepo}/commits?ref=${this.currentRevision}`
          );
          const commits = await res.json();

          if (commits.length === 0) {
            container.innerHTML = `<div class="empty-state">No commits in this repository yet.</div>`;
            return;
          }

          container.innerHTML = `
            <div class="commits-card">
              <div class="commit-log">
                ${commits
                  .map(
                    (c) => `
                  <div class="commit-item">
                    <div class="commit-summary">
                      <strong>${escapeHtml(c.summary)}</strong>
                    </div>
                    <div class="commit-meta">
                      <span class="author">${escapeHtml(c.author_name)}</span> committed on
                      <span class="date">${new Date(c.timestamp).toLocaleString()}</span>
                      <span class="sha"><code>${c.short_id}</code></span>
                    </div>
                  </div>
                `
                  )
                  .join('')}
              </div>
            </div>
          `;
        } catch (e) {
          container.innerHTML = `<div class="error-box">Failed to load commits: ${e}</div>`;
        }
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    window.treeApp = new TreeApp();
  </script>
</body>
</html>

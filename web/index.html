<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tree: Quiet Git Hosting</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --bg-card-header: #1f242c;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --text-bright: #f0f6fc;
      --accent: #238636;
      --accent-hover: #2ea043;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    code, pre {
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .header {
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-card);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 20px;
    }

    .logo.clickable {
      cursor: pointer;
    }

    .site-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-bright);
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-left: 8px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
    }

    .separator {
      color: var(--text-muted);
    }

    .owner-crumb {
      color: var(--text-muted);
    }

    .repo-crumb {
      color: var(--text-bright);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-bright);
    }

    .btn {
      background-color: #21262d;
      color: var(--text-bright);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background-color: #30363d;
      border-color: #8b949e;
    }

    .btn-primary {
      background-color: var(--accent);
      border-color: rgba(240, 246, 252, 0.1);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
    }

    .repo-list {
      display: grid;
      grid-gap: 12px;
    }

    .repo-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .repo-card:hover {
      border-color: #58a6ff;
    }

    .repo-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .repo-name {
      font-size: 16px;
      color: #58a6ff;
    }

    .repo-desc {
      color: var(--text);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .repo-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
    }

    .badge-public {
      background-color: rgba(56, 139, 253, 0.1);
      color: #58a6ff;
      border-color: rgba(56, 139, 253, 0.4);
    }

    .badge-private {
      background-color: rgba(210, 153, 34, 0.1);
      color: #d29922;
      border-color: rgba(210, 153, 34, 0.4);
    }

    .badge-default {
      background-color: #21262d;
      color: var(--text-muted);
      margin-left: 8px;
    }

    .clone-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .clone-label {
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .clone-input {
      flex: 1;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      color: var(--text-bright);
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 16px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--text-bright);
      border-bottom-color: #f78166;
    }

    .file-tree-card, .branches-card, .commits-card, .readme-card, .blob-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .tree-header, .readme-header, .blob-header {
      background-color: var(--bg-card-header);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .branch-pill {
      background: #0d1117;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .tree-table, .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .tree-table th, .tree-table td, .data-table th, .data-table td {
      padding: 8px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .tree-table tr:last-child td, .data-table tr:last-child td {
      border-bottom: none;
    }

    .tree-row {
      cursor: pointer;
    }

    .tree-row:hover {
      background-color: #1f242c;
    }

    .name-cell {
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .size-cell {
      color: var(--text-muted);
      font-size: 12px;
      width: 100px;
    }

    .action-cell {
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      width: 60px;
      text-align: right;
    }

    .readme-body, .blob-body {
      padding: 18px 24px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }

    .commit-log {
      display: flex;
      flex-direction: column;
    }

    .commit-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .commit-item:last-child {
      border-bottom: none;
    }

    .commit-summary {
      color: var(--text-bright);
      margin-bottom: 4px;
    }

    .commit-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .commit-meta .author {
      font-weight: 500;
      color: var(--text);
    }

    .sha code {
      background: #0d1117;
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 4px;
      color: #58a6ff;
    }

    .empty-repo-instructions {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px;
    }

    .empty-repo-instructions h3 {
      color: var(--text-bright);
      margin-bottom: 8px;
    }

    .empty-repo-instructions pre {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      margin-top: 12px;
      color: #58a6ff;
    }

    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.hidden {
      display: none;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      width: 440px;
    }

    .modal-header {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .input {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text-bright);
      font-size: 13px;
    }

    .input:focus {
      outline: none;
      border-color: #58a6ff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .empty-state {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>
